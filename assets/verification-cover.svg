<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">VeriRouter verification demo — Verify the route, verify the answer</title>
  <desc id="desc">A client connects through VeriRouter to a backend model. Two zero-knowledge proofs verify selection and rewriting, and a serving certificate authenticates the answer.</desc>
  <defs>
    <symbol id="laptop" viewBox="0 0 24 24">
      <path d="M3 19h18M5 7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7"/>
    </symbol>
    <symbol id="router" viewBox="0 0 24 24">
      <path d="M3 15a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 17v.01M13 17v.01M15 13v-2M11.75 8.75a4 4 0 0 1 6.5 0M8.5 6.5a8 8 0 0 1 13 0"/>
    </symbol>
    <symbol id="provider" viewBox="0 0 24 24">
      <path d="M3 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7M3 15a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-2M7 8v.01M7 16v.01M11 8h6M11 16h6"/>
    </symbol>
    <symbol id="selection" viewBox="0 0 24 24">
      <path d="M3 19a2 2 0 1 0 4 0 2 2 0 0 0-4 0M19 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4M11 19h5.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H13"/>
    </symbol>
    <symbol id="rewrite" viewBox="0 0 24 24">
      <path d="M14 3v4a1 1 0 0 0 1 1h4M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2M9 15l2 2 4-4"/>
    </symbol>
    <symbol id="certificate" viewBox="0 0 24 24">
      <path d="M12 15a3 3 0 1 0 6 0 3 3 0 0 0-6 0M13 17.5V22l2-1.5 2 1.5v-4.5M10 19H5a2 2 0 0 1-2-2V7c0-1.1.9-2 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-1 1.73M6 9h12M6 12h3M6 15h2"/>
    </symbol>
    <symbol id="shield-check" viewBox="0 0 24 24">
      <path d="M9 12l2 2 4-4M12 3a12 12 0 0 0 8.5 3 12 12 0 0 1-8.5 15A12 12 0 0 1 3.5 6 12 12 0 0 0 12 3"/>
    </symbol>
  </defs>
  <rect width="1920" height="1080" fill="#0b141c"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="120" y="87" fill="#e8f1f8" font-size="42" font-weight="700" letter-spacing="-.8">VeriRouter</text>
    <text x="1800" y="85" text-anchor="end" fill="#82dec2" font-size="36">Verification demo</text>
    <path d="M120 126h1680" stroke="#2a3b48" stroke-width="2"/>
    <text x="113" y="270" fill="#e8f1f8" font-size="112" font-weight="700" letter-spacing="-4">Verify the route.</text>
    <text x="113" y="399" fill="#8ac8fa" font-size="112" font-weight="700" letter-spacing="-4">Verify the answer.</text>
  </g>
  <g fill="none" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <use href="#laptop" x="255" y="530" width="190" height="190" stroke="#d3e3f0"/>
    <use href="#router" x="865" y="530" width="190" height="190" stroke="#8ac8fa"/>
    <use href="#provider" x="1475" y="530" width="190" height="190" stroke="#d3e3f0"/>
  </g>
  <g fill="none" stroke="#667f92" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 628h290m-20-20 20 20-20 20M1110 628h290m-20-20 20 20-20 20"/>
  </g>
  <circle cx="1042" cy="704" r="27" fill="#0b141c" stroke="#82dec2" stroke-width="4"/>
  <path d="m1029 704 9 9 17-18" fill="none" stroke="#82dec2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="46" text-anchor="middle">
    <text x="350" y="794" fill="#d3e3f0">Client</text>
    <text x="960" y="794" fill="#8ac8fa">VeriRouter</text>
    <text x="1570" y="794" fill="#d3e3f0">Backend model</text>
  </g>
  <path d="M120 867h1680" fill="none" stroke="#2a3b48" stroke-width="2"/>
  <g fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#rewrite" x="298" y="905" width="64" height="64" stroke="#8ac8fa"/>
    <use href="#certificate" x="718" y="905" width="64" height="64" stroke="#82dec2"/>
    <use href="#selection" x="1138" y="905" width="64" height="64" stroke="#8ac8fa"/>
    <use href="#shield-check" x="1558" y="905" width="64" height="64" stroke="#82dec2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e8f1f8" font-size="36" text-anchor="middle">
    <text x="330" y="1020">Request integrity</text>
    <text x="750" y="1020">Response integrity</text>
    <text x="1170" y="1020">Model eligibility</text>
    <text x="1590" y="1020">Model identity</text>
  </g>
</svg>
