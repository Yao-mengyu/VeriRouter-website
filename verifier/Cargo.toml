[package]
name = "verirouter-web-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plonky2 = { version = "=1.1.0", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.114"
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
