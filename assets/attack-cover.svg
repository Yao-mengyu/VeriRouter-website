<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">VeriRouter attack demo — When the router breaks trust</title>
  <desc id="desc">A client connects to a compromised router and then a backend model. The router can alter the request, substitute the model, and rewrite the answer.</desc>
  <defs>
    <symbol id="laptop" viewBox="0 0 24 24">
      <path d="M3 19h18M5 7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7"/>
    </symbol>
    <symbol id="router" viewBox="0 0 24 24">
      <path d="M3 15a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 17v.01M13 17v.01M15 13v-2M11.75 8.75a4 4 0 0 1 6.5 0M8.5 6.5a8 8 0 0 1 13 0"/>
    </symbol>
    <symbol id="provider" viewBox="0 0 24 24">
      <path d="M3 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7M3 15a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-2M7 8v.01M7 16v.01M11 8h6M11 16h6"/>
    </symbol>
    <symbol id="edit" viewBox="0 0 24 24">
      <path d="m16 4 4 4M4 20l4-1 12-12a2.83 2.83 0 0 0-4-4L4 15l-1 6 6-1"/>
    </symbol>
    <symbol id="swap" viewBox="0 0 24 24">
      <path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4 4-4-4 4-4"/>
    </symbol>
    <symbol id="message" viewBox="0 0 24 24">
      <path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 3V6a2 2 0 0 1 2-2M7 9h10M7 13h7"/>
    </symbol>
    <symbol id="eye-off" viewBox="0 0 24 24">
      <path d="M10.585 10.587a2 2 0 0 0 2.829 2.828M16.681 16.673a8.717 8.717 0 0 1-4.681 1.327c-3.6 0-6.6-2-9-6 1.272-2.12 2.712-3.678 4.32-4.674m2.86-1.146a9.055 9.055 0 0 1 1.82-.18c3.6 0 6.6 2 9 6-.666 1.11-1.379 2.067-2.138 2.87M3 3l18 18"/>
    </symbol>
  </defs>
  <rect width="1920" height="1080" fill="#0b141c"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="120" y="87" fill="#e8f1f8" font-size="42" font-weight="700" letter-spacing="-.8">VeriRouter</text>
    <text x="1800" y="85" text-anchor="end" fill="#ff91a5" font-size="36">Attack demo</text>
    <path d="M120 126h1680" stroke="#2a3b48" stroke-width="2"/>
    <text x="113" y="270" fill="#e8f1f8" font-size="112" font-weight="700" letter-spacing="-4">When the router</text>
    <text x="113" y="399" fill="#ff91a5" font-size="112" font-weight="700" letter-spacing="-4">breaks trust.</text>
  </g>
  <g fill="none" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <use href="#laptop" x="255" y="530" width="190" height="190" stroke="#d3e3f0"/>
    <use href="#router" x="865" y="530" width="190" height="190" stroke="#ff91a5"/>
    <use href="#provider" x="1475" y="530" width="190" height="190" stroke="#d3e3f0"/>
  </g>
  <g fill="none" stroke="#667f92" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 628h290m-20-20 20 20-20 20M1110 628h290m-20-20 20 20-20 20"/>
  </g>
  <circle cx="1042" cy="704" r="27" fill="#0b141c" stroke="#ff91a5" stroke-width="4"/>
  <path d="m1033 695 18 18m0-18-18 18" fill="none" stroke="#ff91a5" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="46" text-anchor="middle">
    <text x="350" y="794" fill="#d3e3f0">Client</text>
    <text x="960" y="794" fill="#ff91a5">Router</text>
    <text x="1570" y="794" fill="#d3e3f0">Backend model</text>
  </g>
  <path d="M120 867h1680" fill="none" stroke="#2a3b48" stroke-width="2"/>
  <g fill="none" stroke="#ff91a5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#edit" x="298" y="905" width="64" height="64"/>
    <use href="#message" x="718" y="905" width="64" height="64"/>
    <use href="#swap" x="1138" y="905" width="64" height="64"/>
    <use href="#eye-off" x="1558" y="905" width="64" height="64"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e8f1f8" font-size="36" text-anchor="middle">
    <text x="330" y="1020">Prompt injection</text>
    <text x="750" y="1020">Answer tampering</text>
    <text x="1170" y="1020">Model substitution</text>
    <text x="1590" y="1020">Identity spoofing</text>
  </g>
</svg>
